[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-router"
version = "0.1.0"
description = "Intelligent tool router: filters a large enterprise tool catalog down to a small, high-precision, ordered tool plan per query (routing-as-a-service)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Core stays deliberately lean: the engine must install fast and run anywhere
# (CI, offline, resource-constrained hosts). Heavy/optional capabilities live
# behind provider interfaces and are pulled in via extras.
dependencies = [
    "pydantic>=2.5",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]          # REST service — implemented, used
mcp = ["mcp>=1.30,<2"]                               # MCP server + importer — implemented, used (mcp 2.x renamed FastMCP: not supported yet)
test = ["pytest>=8", "httpx>=0.27"]                 # run the test suite: pip install -e ".[api,mcp,test]"
keyring = ["keyring>=24"]                           # OS keyring for secrets — used opportunistically if installed; falls back to a 0600 file otherwise (this is the tested path)

[project.scripts]
tool-router = "tool_router.cli:main"

[tool.setuptools.packages.find]
include = ["tool_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
